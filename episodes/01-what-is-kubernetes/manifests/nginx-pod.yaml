# A single Pod. Nothing watches it: delete it and it stays deleted.
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx-solo
spec:
  containers:
    - name: nginx
      image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
      ports:
        - containerPort: 80
